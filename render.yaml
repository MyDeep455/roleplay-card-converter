# One-click deploy of the proxy half of this tool.
#
# Only needed if you host the tool and want visitors to be able to mirror a
# Character Tavern library. Everything else works without it - see README.
#
# Render reads this file when you point a new Blueprint at the repo. There is
# nothing to build and nothing to install: proxy.js has no dependencies.
services:
  - type: web
    name: roleplay-card-converter-proxy
    runtime: node
    plan: free
    # Without this Render silently picks Oregon, which puts a transatlantic
    # round trip in front of every library search for European users. Change it
    # to whichever region is nearest you - and note that Render cannot move an
    # existing service, so this only takes effect on one created fresh.
    region: frankfurt
    buildCommand: ""
    startCommand: "node proxy.js"
    healthCheckPath: /health
